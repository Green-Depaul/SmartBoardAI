server.port=8080
spring.application.name=smartboard-api

# Python AI service endpoint
python.service.url=http://localhost:8000/api/ai/generate_plan

# Initial DB setup (H2 in-memory) to run init.sql on startup
spring.datasource.url=jdbc:h2:mem:smartboard;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:init.sql
spring.jpa.hibernate.ddl-auto=none
